name: qualite

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tests
        run: node --test tests/*.test.js
      - name: validation
        run: node tools/validate.js
