<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .header-bar { fill: #161b22; }
      .circle-red { fill: #ff5f56; }
      .circle-yellow { fill: #ffbd2e; }
      .circle-green { fill: #27c93f; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; font-weight: 500; }
      .code-prompt { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #58a6ff; font-weight: 600; }
      .code-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #3fb950; font-weight: 500; }
      .cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .text-stream {
        stroke-dasharray: 450;
        stroke-dashoffset: 450;
        animation: type 4s steps(45, end) infinite;
        overflow: hidden;
      }
      @keyframes type {
        0% { max-width: 0; }
        60%, 85% { max-width: 500px; }
        95%, 100% { max-width: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="terminal-bg" x="1" y="1" width="798" height="118" />

  <!-- Terminal Top Navigation Bar -->
  <path class="header-bar" d="M 1,9 Q 1,1 9,1 L 791,1 Q 799,1 799,9 L 799,32 L 1,32 Z" />
  <circle class="circle-red" cx="20" cy="16" r="5.5" />
  <circle class="circle-yellow" cx="38" cy="16" r="5.5" />
  <circle class="circle-green" cx="56" cy="16" r="5.5" />
  <text class="header-title" x="400" y="20">bash — 80x24</text>

  <!-- Interactive Terminal Prompt & Typed Text -->
  <g transform="translate(24, 68)">
    <text class="code-prompt" x="0" y="0">engineer@nexus:~$</text>
    <text class="code-text" x="165" y="0">
      deploy --profile=production --immutable --zero-downtime
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" keyTimes="0;0.1;0.85;1" repeatCount="indefinite" />
    </text>
    <rect class="cursor" x="655" y="-12" width="8" height="15" />
  </g>

  <!-- Output feedback -->
  <g transform="translate(24, 94)">
    <text font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
      [✓] All 64 clusters synced • Consensus maintained • Uptime: 99.995%
      <animate attributeName="opacity" values="0;0;1;1;0" dur="5s" keyTimes="0;0.35;0.4;0.85;1" repeatCount="indefinite" />
    </text>
  </g>
</svg>
