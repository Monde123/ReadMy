<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="60">
  <defs>
    <style>
      .radar-bg { fill: #05080e; stroke: #1e293b; stroke-width: 1; rx: 6px; }
      .radar-pulse-ring {
        fill: none;
        stroke: #00ff66;
        stroke-width: 1.5;
        opacity: 0;
      }
      .ring-1 {
        animation: pulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .ring-2 {
        animation: pulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 0.8s;
      }
      @keyframes pulseRing {
        0% { r: 5; opacity: 0.9; }
        80%, 100% { r: 24; opacity: 0; }
      }
      .status-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #00ff66;
        letter-spacing: 1.5px;
      }
      .sub-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        fill: #94a3b8;
      }
      .telemetry-node {
        fill: #00f0ff;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background bar -->
  <rect class="radar-bg" x="1" y="1" width="798" height="58" />

  <!-- Animated Pulse Beacon -->
  <g transform="translate(36, 30)">
    <circle class="radar-pulse-ring ring-1" cx="0" cy="0" r="5" />
    <circle class="radar-pulse-ring ring-2" cx="0" cy="0" r="5" />
    <circle cx="0" cy="0" r="6" fill="#00ff66" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Status Label & Telemetry -->
  <text class="status-text" x="72" y="27">SYSTEM TELEMETRY : ONLINE</text>
  <text class="sub-text" x="72" y="44">LATENCY: &lt; 1.8ms • CLUSTER: 64 NODES HEALTHY • DEFCON 5</text>

  <!-- Right side stats -->
  <text class="telemetry-node" x="760" y="34" text-anchor="end">NODE-ALPHA // S-07 [ACTIVE]</text>
</svg>
